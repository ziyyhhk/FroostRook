name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build native engine
        shell: msys2 {0}
        run: |
          cd native
          windres app.rc -O coff -o app.o
          g++ -O3 -std=c++17 -static -o FroostRook.exe kiwa.cpp nnue.cpp app.o
          ls -l FroostRook.exe

      - name: Perft smoke test
        shell: msys2 {0}
        run: |
          out=$(native/FroostRook.exe perft 4)
          echo "$out"
          echo "$out" | grep -q 197281

      - name: Book / rules smoke test
        shell: msys2 {0}
        run: |
          out=$(printf 'position startpos\ngo wtime 60000 btime 60000\nquit\n' | native/FroostRook.exe)
          echo "$out" | grep -q '^bestmove '
          out2=$(printf 'position fen 7k/5Q2/6K1/8/8/8/8/8 b - - 0 1\ngo depth 2\nquit\n' | native/FroostRook.exe)
          echo "$out2" | grep -q 'bestmove 0000'

      - name: Build NNUE experiment and run its parity self-test
        shell: msys2 {0}
        run: |
          cd native
          g++ -O3 -std=c++17 -static -o nnue_bench.exe nnue.cpp nnue_bench.cpp
          cd ..
          ./native/nnue_bench.exe data/nnue/frnn1.bin data/nnue/selftest.txt > nnue-selftest.log 2>&1
          tail -8 nnue-selftest.log

      - name: Node regression tests
        shell: bash
        run: |
          node test/perft.js
          node test/perft-native.js
          node test/book-check.js
          node test/rules.js
          node test/prediction.js
          node test/uci-smoke.js
          node test/stop-test.js
          node test/ponder-test.js
          node test/openings-native.js 20 6
          node test/book-fallback.js 2 6
          node test/analyze-test.js

      - name: Zip the testable build (binaries plus the Node front-end)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          dir="dist/FroostRook-$version"
          mkdir -p "$dir/native" "$dir/data/nnue" "$dir/test" "$dir/docs"
          cp native/FroostRook.exe "$dir/"
          cp FroostRook.bat README.md CHANGELOG.md engine.js uci.js native.js native-exe.js book.js play.js package.json predict-model.js analyze.js "$dir/"
          cp native/book_data.h native/kiwa.cpp native/build.bat native/app.rc "$dir/native/"
          cp native/nnue.h native/nnue.cpp native/nnue_bench.cpp native/nnue_bench.exe "$dir/native/"
          cp data/nnue/* "$dir/data/nnue/"
          cp -r tools "$dir/"
          cp -r assets "$dir/"
          cp data/*.json "$dir/data/"
          cp docs/*.md "$dir/docs/"
          cp wacnew.epd "$dir/"
          cp -r book-data "$dir/"
          cp test/*.js test/*.md "$dir/test/"
          cp -r test/data "$dir/test/"
          cp -r test/human-games "$dir/test/"
          ( cd dist && python -c "import shutil; shutil.make_archive('FroostRook-$version-full','zip','.','FroostRook-$version')" )
          git archive --format=zip --output="dist/FroostRook-$version-source.zip" HEAD
          python -c "import zipfile; z=zipfile.ZipFile('dist/FroostRook-$version-full.zip'); bad=[n for n in z.namelist() if '\\\\' in n]; print('zip entries with backslashes:', len(bad)); assert not bad"
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: FroostRook-windows-x64
          path: |
            native/FroostRook.exe
            dist/*-full.zip
            dist/*-source.zip

      - name: Attach binary to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "FroostRook 1.0.4 Beta" \
              --notes "Portable Windows x64 build (generic x86-64, no CPU-specific instructions). Import FroostRook.exe directly into any UCI GUI. The full ZIP adds the Node front-end, opening book, learned prediction model, PGN analysis tool, test suite and the experimental FRNN1 NNUE module (not used by the playing engine). Source code archives are attached automatically and as a source ZIP. See README.md, docs/UCI.md, docs/NNUE.md and docs/TESTING.md for options, measured results and the full test report."
          gh release upload "$GITHUB_REF_NAME" native/FroostRook.exe dist/*-full.zip dist/*-source.zip --clobber
