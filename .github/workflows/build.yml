name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build native engine
        shell: msys2 {0}
        run: |
          cd native
          g++ -O3 -std=c++17 -static -o kiwa-native.exe kiwa.cpp
          cp kiwa-native.exe KiwaChess.exe
          ls -l kiwa-native.exe KiwaChess.exe

      - name: Perft smoke test
        shell: msys2 {0}
        run: |
          out=$(native/KiwaChess.exe perft 4)
          echo "$out"
          echo "$out" | grep -q 197281

      - name: Book / rules smoke test
        shell: msys2 {0}
        run: |
          out=$(printf 'position startpos\ngo wtime 60000 btime 60000\nquit\n' | native/KiwaChess.exe)
          echo "$out" | grep -q '^bestmove '
          out2=$(printf 'position fen 7k/5Q2/6K1/8/8/8/8/8 b - - 0 1\ngo depth 2\nquit\n' | native/KiwaChess.exe)
          echo "$out2" | grep -q 'bestmove 0000'

      - name: Node regression tests
        shell: bash
        run: |
          node test/book-check.js
          node test/rules.js
          node test/prediction.js
          node test/uci-smoke.js
          node test/openings-native.js 20 6

      - uses: actions/upload-artifact@v4
        with:
          name: KiwaChess-windows-x64
          path: |
            native/KiwaChess.exe
            native/kiwa-native.exe

      - name: Attach binary to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "KiwaChess ${GITHUB_REF_NAME#v}" \
              --notes "Portable Windows x64 build (generic x86-64, no CPU-specific instructions). Import KiwaChess.exe directly into any UCI GUI; kiwa-native.exe is the same binary under the name the Node front-end expects."
          gh release upload "$GITHUB_REF_NAME" native/KiwaChess.exe native/kiwa-native.exe --clobber
